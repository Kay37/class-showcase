name: Add me to the Class Code Showcase
description: Pick which of your projects show on the site.
title: "Add me"
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Just click **Create** below. You'll show up on the site right away.
        To change your picks later, use **Add me** on the site again. Your newest one counts.
  - type: textarea
    id: repos
    attributes:
      label: Projects to show
      description: One repo name per line. Only your own public repos show. Leave empty to show all your public Java repos.
  - type: checkboxes
    id: notify
    attributes:
      label: Comment emails
      description: Off unless you tick it. GitHub sends these, using your GitHub notification settings.
      options:
        - label: Email me (through GitHub) when someone comments on my projects
          required: false
