<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Class Code Showcase</title>
  <link rel="stylesheet" media="(prefers-color-scheme: light)"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" media="(prefers-color-scheme: dark)"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" id="brand">Class Code Showcase</a>
    <form class="open-form" id="open-form">
      <input id="open-input" type="text" placeholder="Paste a GitHub repo link" aria-label="GitHub repo link" autocomplete="off">
      <button type="submit">Open</button>
    </form>
    <a class="btn primary" href="#/add-me">Add my projects</a>
  </header>
  <main id="app"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="config.js?v=dev"></script>
  <script src="app.js?v=dev"></script>
</body>
</html>
